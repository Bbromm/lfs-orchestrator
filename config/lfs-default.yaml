    tasks:
      configure:
        script: scripts/phase5-chapter9.sh
        deps:
        - phase8/dbus
        sbu_estimate: 0.1
        env:
          HOSTNAME: lfs
          TIMEZONE: Europe/Moscow
          LOCALE: ru_RU.UTF-8
  phase10:
