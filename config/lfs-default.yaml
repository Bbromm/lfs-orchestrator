version: 13.1-systemd
defaults:
  executor: chroot
  timeout: 7200
  retries: 0
  env:
    LFS: /mnt/lfs
    LFS_TGT: x86_64-lfs-linux-gnu
    PATH: /mnt/lfs/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
phases:
  phase5:
    executor: lfs
    name: Глава 5 — Кросс-инструментарий
    tasks:
      binutils-pass1:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - binutils-pass1
        deps: []
        sbu_estimate: 1.0
        timeout: 3600
      gcc-pass1:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - gcc-pass1
        deps:
        - phase5/binutils-pass1
        sbu_estimate: 4.3
        timeout: 7200
      linux-headers:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - linux-headers
        deps:
        - phase5/gcc-pass1
        sbu_estimate: 0.1
        timeout: 900
      glibc:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - glibc
        deps:
        - phase5/linux-headers
        sbu_estimate: 1.3
        timeout: 3600
      libstdcpp:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - libstdcpp
        deps:
        - phase5/glibc
        sbu_estimate: 0.3
        timeout: 1800
  phase6:
    executor: lfs
    name: Глава 6 — Временные инструменты
    tasks:
      m4:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - m4
        deps:
        - phase5/libstdcpp
        sbu_estimate: 0.1
      ncurses:
