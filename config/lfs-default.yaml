        args:
        - --only
        - ncurses
        deps:
        - phase6/m4
        sbu_estimate: 0.4
      bash:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - bash
        deps:
        - phase6/ncurses
        sbu_estimate: 0.2
      coreutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - coreutils
        deps:
        - phase6/bash
        sbu_estimate: 0.3
      diffutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - diffutils
        deps:
        - phase6/coreutils
        sbu_estimate: 0.1
      file:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - file
        deps:
        - phase6/diffutils
        sbu_estimate: 0.1
      findutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - findutils
        deps:
        - phase6/file
        sbu_estimate: 0.2
      gawk:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - gawk
        deps:
        - phase6/findutils
        sbu_estimate: 0.1
      grep:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - grep
        deps:
        - phase6/gawk
        sbu_estimate: 0.1
      gzip:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - gzip
        deps:
        - phase6/grep
        sbu_estimate: 0.1
      make:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - make
        deps:
        - phase6/gzip
        sbu_estimate: 0.1
      patch:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - patch
        deps:
        - phase6/make
        sbu_estimate: 0.1
      sed:
        script: scripts/install-chapter6.sh
        args:
        - --only
