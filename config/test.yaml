        deps:
        - phase8/wheel
        sbu_estimate: 0.1
      meson:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - meson
        deps:
        - phase8/setuptools
        sbu_estimate: 0.1
      markupsafe:
        script: scripts/install-chapter8.sh
        args:
        - --only
