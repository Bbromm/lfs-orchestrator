        args:
        - --only
        - bison
        deps:
        - phase8/m4
        sbu_estimate: 2.1
      grep:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - grep
        deps:
        - phase8/pcre2
        sbu_estimate: 0.5
      diffutils:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - diffutils
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.4
      findutils:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - findutils
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.9
      make:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - make
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.6
      patch:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - patch
        deps:
        - phase8/attr
        sbu_estimate: 0.2
      sed:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - sed
        deps:
        - phase8/acl
        - phase8/attr
        sbu_estimate: 0.4
      tar:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - tar
        deps:
        - phase8/acl
        - phase8/attr
        sbu_estimate: 0.5
      mpdecimal:
        script: scripts/install-chapter8.sh
        args:
        - --only
