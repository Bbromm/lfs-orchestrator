        sbu_estimate: 0.1
      kmod:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - kmod
        deps:
        - phase8/zstd
        - openssl
        sbu_estimate: 0.1
      systemd:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - systemd
        deps:
        - phase8/kmod
        - phase8/jinja2
        - phase8/meson
        - openssl
        - phase8/pcre2
        - util-linux
        sbu_estimate: 1.2
      dbus:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - dbus
        deps:
        - phase8/systemd
        - util-linux
        sbu_estimate: 0.1
  phase9:
    name: Глава 9 — Конфигурация системы
    tasks:
      configure:
        script: scripts/phase5-chapter9.sh
        deps:
        - phase8/dbus
        sbu_estimate: 0.1
        env:
          HOSTNAME: lfs
          TIMEZONE: Europe/Moscow
          LOCALE: ru_RU.UTF-8
  phase10:
    name: Глава 10 — Ядро + GRUB
    tasks:
      kernel:
        script: scripts/phase6-chapter10.sh
        deps:
        - phase9/configure
        sbu_estimate: 2.5
        timeout: 10800
        env:
          KERNEL_CONFIG_METHOD: defconfig
          KERNEL_JOBS: '8'
  phase11:
    name: Глава 11 — Финализация
    tasks:
      finalize:
        script: scripts/postinstall.sh
        deps:
        - phase10/kernel
        sbu_estimate: 0.1