version: 13.1-systemd
defaults:
  executor: docker
  timeout: 7200
  retries: 0
  env:
    LFS: /mnt/lfs
    LFS_TGT: x86_64-lfs-linux-gnu
    PATH: "/mnt/lfs/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
phases:
  phase5:
    name: Глава 5 — Кросс-инструментарий
    tasks:
      binutils-pass1:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - binutils-pass1
        deps: []
        sbu_estimate: 1.0
        timeout: 3600
      gcc-pass1:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - gcc-pass1
        deps:
        - phase5/binutils-pass1
        sbu_estimate: 4.3
        timeout: 7200
      linux-headers:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - linux-headers
        deps:
        - phase5/gcc-pass1
        sbu_estimate: 0.1
        timeout: 900
      glibc:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - glibc
        deps:
        - phase5/linux-headers
        sbu_estimate: 1.3
        timeout: 3600
      libstdcpp:
        script: scripts/install-chapter5.sh
        args:
        - --only
        - libstdcpp
        deps:
        - phase5/glibc
        sbu_estimate: 0.3
        timeout: 1800
  phase6:
    name: Глава 6 — Временные инструменты
    tasks:
      m4:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - m4
        deps:
        - phase5/libstdcpp
        sbu_estimate: 0.1
      ncurses:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - ncurses
        deps:
        - phase6/m4
        sbu_estimate: 0.4
      bash:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - bash
        deps:
        - phase6/ncurses
        sbu_estimate: 0.2
      coreutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - coreutils
        deps:
        - phase6/bash
        sbu_estimate: 0.3
      diffutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - diffutils
        deps:
        - phase6/coreutils
        sbu_estimate: 0.1
      file:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - file
        deps:
        - phase6/diffutils
        sbu_estimate: 0.1
      findutils:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - findutils
        deps:
        - phase6/file
        sbu_estimate: 0.2
      gawk:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - gawk
        deps:
        - phase6/findutils
        sbu_estimate: 0.1
      grep:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - grep
        deps:
        - phase6/gawk
        sbu_estimate: 0.1
      gzip:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - gzip
        deps:
        - phase6/grep
        sbu_estimate: 0.1
      make:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - make
        deps:
        - phase6/gzip
        sbu_estimate: 0.1
      patch:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - patch
        deps:
        - phase6/make
        sbu_estimate: 0.1
      sed:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - sed
        deps:
        - phase6/patch
        sbu_estimate: 0.1
      tar:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - tar
        deps:
        - phase6/sed
        sbu_estimate: 0.1
      xz:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - xz
        deps:
        - phase6/tar
        sbu_estimate: 0.1
      binutils-pass2:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - binutils-pass2
        deps:
        - phase6/xz
        sbu_estimate: 0.4
      gcc-pass2:
        script: scripts/install-chapter6.sh
        args:
        - --only
        - gcc-pass2
        deps:
        - phase6/binutils-pass2
        sbu_estimate: 5.2
  phase7:
    name: Глава 7 — Chroot и доп. инструменты
    tasks:
      chroot-setup:
        script: scripts/install-chapter7.sh
        args:
        - --phase-a
        deps:
        - phase6/gcc-pass2
        sbu_estimate: 0.1
        timeout: 900
      extra-tools:
        script: scripts/install-chapter7.sh
        args:
        - --only-phase-b
        deps:
        - phase7/chroot-setup
        sbu_estimate: 3.0
        timeout: 7200
  phase8:
    name: Глава 8 — Базовое системное ПО
    max_parallel: 4
    tasks:
      zlib:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - zlib
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      bzip2:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - bzip2
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      xz:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - xz
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      lz4:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - lz4
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      zstd:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - zstd
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.4
      file:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - file
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      m4:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - m4
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.4
      bc:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - bc
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      flex:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - flex
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      psmisc:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - psmisc
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      less:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - less
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      gperf:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - gperf
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.2
      expat:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - expat
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      gmp:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - gmp
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.3
      mpfr:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - mpfr
        deps:
        - phase8/gmp
        sbu_estimate: 0.2
      mpc:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - mpc
        deps:
        - phase8/mpfr
        sbu_estimate: 0.1
      attr:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - attr
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      acl:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - acl
        deps:
        - phase8/attr
        sbu_estimate: 0.1
      libcap:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - libcap
        deps:
