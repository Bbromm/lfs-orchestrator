        sbu_estimate: 0.1
      libffi:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - libffi
        deps:
        - phase7/extra-tools
        sbu_estimate: 1.7
      sqlite:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - sqlite
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.4
      readline:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - readline
        deps:
        - phase7/extra-tools
        sbu_estimate: 0.1
      pcre2:
        script: scripts/install-chapter8.sh
        args:
        - --only
        - pcre2
