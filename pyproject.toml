[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-orchestrator"
version = "1.0.0"
description = "DAG-based orchestrator for Linux From Scratch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "aiosqlite>=0.20",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
]

[project.scripts]
lfs-orchestrator = "lfs_orchestrator.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]
